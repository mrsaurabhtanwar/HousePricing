services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: house_pricing_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/database/housing_database.db
    volumes:
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: house_pricing_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000/predict-price
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped